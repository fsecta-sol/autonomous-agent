[project]
name = "dashboard-agent"
version = "0.1.0"
description = "LangGraph agent runtime for the autonomous-agent dashboard"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "langgraph>=0.6",
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "langchain-mcp-adapters>=0.1",
    "beautifulsoup4>=4.12",
]

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.ruff]
line-length = 120
target-version = "py310"
